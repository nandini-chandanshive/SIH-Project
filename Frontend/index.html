<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore India</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>


<!-- =====================================================
     LANDING PAGE
===================================================== -->

<section class="hero" id="landingPage">

    <!-- Background image layers -->
    <div class="hero-bg bg1" id="bg1"></div>
    <div class="hero-bg bg2" id="bg2"></div>

    <!-- Dark overlay -->
    <div class="overlay"></div>


    <!-- ================= NAVBAR ================= -->

    <nav>

        <div class="logo">
            🇮🇳 Explore India
        </div>

        <div class="nav-buttons">

            <button onclick="openLogin()">
                Login
            </button>

            <button onclick="openSignup()">
                Sign Up
            </button>

        </div>

    </nav>


    <!-- ================= HERO CONTENT ================= -->

    <div class="hero-content">

        <h1>
            Discover <span>India</span>
        </h1>

        <p>
            Explore India's heritage, culture, nature,
            food and hidden destinations — all in one place.
        </p>

        <button
            class="explore-btn"
            onclick="openSignup()">

            Start Exploring

        </button>

    </div>


    <!-- Image slider dots -->
    <div class="dots" id="dots"></div>

</section>



<!-- =====================================================
     LOGIN / SIGNUP MODAL
===================================================== -->

<div class="modal" id="authModal">

    <div class="modal-box">

        <span
            class="close"
            onclick="closeModal('authModal')">

            ×

        </span>


        <h2>
            Welcome to Explore India
        </h2>


        <!-- Login / Signup tabs -->

        <div class="tabs">

            <button
                id="loginTab"
                onclick="showLogin()">

                Login

            </button>

            <button
                id="signupTab"
                onclick="showSignup()">

                Sign Up

            </button>

        </div>


        <!-- =================================================
             LOGIN
             
             Email ONLY
        ================================================= -->

        <form
            id="loginForm"
            onsubmit="login(event)">


            <!-- Email -->

            <label>
                Email Address
            </label>

            <input
                type="email"
                placeholder="Enter your email"
                required>


            <!-- Password -->

            <label>
                Password
            </label>

            <input
                type="password"
                placeholder="Enter your password"
                required>


            <button class="submit-btn">
                Login
            </button>

        </form>



        <!-- =================================================
             SIGN UP
             
             Email ONLY
        ================================================= -->

        <form
            id="signupForm"
            style="display:none;"
            onsubmit="signup(event)">


            <label>
                Email Address
            </label>

            <input
                type="email"
                placeholder="Enter your email"
                required>


            <label>
                Create Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create password"
                required>


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required>


            <button class="submit-btn">
                Continue
            </button>

        </form>

    </div>

</div>



<!-- =====================================================
     USER DETAILS
===================================================== -->

<div class="modal" id="detailsModal">

    <div class="modal-box profile">

        <span
            class="close"
            onclick="closeModal('detailsModal')">

            ×

        </span>


        <h2>
            Tell Us About Yourself
        </h2>


        <form onsubmit="createAccount(event)">


            <!-- ================= BASIC INFORMATION ================= -->

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required>


            <!-- Date of birth -->

            <label>
                Date of Birth
            </label>

            <input
                type="date"
                id="dob"
                onchange="calculateAge()"
                required>


            <!-- Automatically calculated age -->

            <label>
                Age
            </label>

            <input
                type="text"
                id="age"
                placeholder="Age will appear here"
                readonly>


            <!-- Citizenship -->

            <label>
                Are you an Indian citizen?
            </label>

            <select
                id="citizen"
                onchange="citizenFields()"
                required>

                <option value="">
                    Select
                </option>

                <option value="yes">
                    Yes
                </option>

                <option value="no">
                    No
                </option>

            </select>



            <!-- =================================================
                 INDIAN CITIZEN QUESTIONS
            ================================================= -->

            <div
                id="indian"
                class="extra">


                <!-- State -->

                <label>
                    State
                </label>

                <select>

                    <option>Maharashtra</option>
                    <option>Gujarat</option>
                    <option>Goa</option>
                    <option>Rajasthan</option>
                    <option>Delhi</option>
                    <option>Karnataka</option>
                    <option>Kerala</option>
                    <option>Tamil Nadu</option>
                    <option>Uttar Pradesh</option>
                    <option>West Bengal</option>
                    <option>Other</option>

                </select>


                <!-- Tourism interests -->

                <label>
                    What type of places do you like?
                </label>

                <select>

                    <option>
                        Heritage & History
                    </option>

                    <option>
                        Nature & Wildlife
                    </option>

                    <option>
                        Adventure
                    </option>

                    <option>
                        Beaches
                    </option>

                    <option>
                        Spiritual Tourism
                    </option>

                    <option>
                        Food & Culture
                    </option>

                </select>


                <!-- Travel companion -->

                <label>
                    Who do you travel with?
                </label>

                <select>

                    <option>Solo</option>
                    <option>Family</option>
                    <option>Friends</option>
                    <option>Couple</option>

                </select>

            </div>



            <!-- =================================================
                 FOREIGN VISITOR QUESTIONS
            ================================================= -->

            <div
                id="foreign"
                class="extra">


                <!-- Country -->

                <label>
                    Country
                </label>

                <input
                    type="text"
                    placeholder="Enter your country">


                <!-- Tourism interests -->

                <label>
                    What interests you?
                </label>

                <select>

                    <option>
                        Heritage & History
                    </option>

                    <option>
                        Nature & Wildlife
                    </option>

                    <option>
                        Beaches
                    </option>

                    <option>
                        Adventure
                    </option>

                    <option>
                        Food & Culture
                    </option>

                    <option>
                        Spiritual Tourism
                    </option>

                </select>


                <!-- Travel companion -->

                <label>
                    Who are you travelling with?
                </label>

                <select>

                    <option>Solo</option>
                    <option>Family</option>
                    <option>Friends</option>
                    <option>Couple</option>

                </select>

            </div>


            <!-- Create account -->

            <button class="submit-btn">
                Create Account
            </button>

        </form>

    </div>

</div>



<!-- =====================================================
     DASHBOARD
     
     Tourism cards removed.
===================================================== -->

<section id="dashboard">

    <header>

        <h2>
            🇮🇳 Explore India
        </h2>

        <button onclick="logout()">
            Logout
        </button>

    </header>


    <main>

        <h1>
            Welcome,
            <span id="userName"></span>!
        </h1>

        <p>
            Let's discover the beauty of India.
        </p>

    </main>

</section>



<!-- JavaScript -->

<script src="js/main.js"></script>

</body>

</html>
